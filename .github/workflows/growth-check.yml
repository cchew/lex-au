# .github/workflows/growth-check.yml
name: Growth check

on:
  schedule:
    # Weekly, Sunday 18:00 UTC (~Monday 4am AEST) -- off-hours, ahead of freshness-check.
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

concurrency:
  group: corpus-publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  growth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lexau
        run: pip install -e ".[dev]"

      - name: Restore corpus from Hugging Face
        run: python scripts/restore_corpus_from_hf.py --repo cchew/lex-au --local-dir corpus

      - name: Fetch live Act list
        run: lexau list-acts --output /tmp/live-acts.txt

      - name: Diff against corpus
        run: python scripts/diff_new_acts.py --live-acts /tmp/live-acts.txt --corpus-dir corpus --output /tmp/new-acts.txt --exclude-titles docs/corpus-exclusions-drop-titles.txt --limit 20

      - name: Build new Acts
        run: |
          if [ -s /tmp/new-acts.txt ]; then
            lexau build --list-file /tmp/new-acts.txt --corpus-dir corpus
          else
            echo "No new Acts to build."
          fi

      - name: Report unresolved growth failures
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/diff_new_acts.py --live-acts /tmp/live-acts.txt --corpus-dir corpus --output /tmp/still-missing.txt --exclude-titles docs/corpus-exclusions-drop-titles.txt
          if [ -s /tmp/still-missing.txt ]; then
            total=$(wc -l < /tmp/still-missing.txt)
            {
              echo "Acts that failed to build during this growth-check run and remain outside the corpus:"
              echo ""
              head -50 /tmp/still-missing.txt | sed 's/^/- /'
              if [ "$total" -gt 50 ]; then
                echo ""
                echo "(showing first 50 of $total total)"
              fi
              echo ""
              echo "These are retried automatically next scheduled run. See the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            } > /tmp/growth-failure-body.md
            python scripts/report_pipeline_issue.py \
              --repo "${{ github.repository }}" \
              --label growth-unresolved-acts \
              --title "Growth workflow: unresolved Acts" \
              --body-file /tmp/growth-failure-body.md
          else
            echo "All candidate Acts built successfully."
          fi

      - name: Publish corpus
        uses: ./.github/actions/publish-corpus
        with:
          run-label: growth-check
          hf-token: ${{ secrets.HF_TOKEN }}
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
          gh-token: ${{ github.token }}

      - name: Regenerate and commit acts.txt
        run: |
          python scripts/regenerate_acts_txt.py --corpus-dir corpus --output acts.txt
          git config user.name "lex-au-bot"
          git config user.email "actions@users.noreply.github.com"
          git add acts.txt
          if git diff --cached --quiet; then
            echo "acts.txt unchanged."
          else
            git commit -m "chore: regenerate acts.txt (automated growth-check run)"
            git push
          fi
